# Portainer stack: Repository, compose path docker-compose.yml.
# The image is built by GitHub Actions (.github/workflows/image.yml) on every push to main,
# so the host only pulls it and needs no build tools. To roll back, pin a tag: :sha-<short>.
services:
  boardgame-stats:
    image: ghcr.io/gjerdingc/boardgame:latest
    # Check for a newer image on every deploy
    pull_policy: always
    container_name: boardgame-stats
    restart: unless-stopped
    # No host port: plain HTTP on port 8080, only on the "proxy" network. Traefik there
    # terminates HTTPS and forwards to http://boardgame-stats:8080 (configured in Traefik).
    # Never publish a port: the app trusts the gateway's X-Auth-Request-Email header.
    expose:
      - "8080"
    networks:
      - proxy
    environment:
      TZ: Europe/Oslo
      # BoardGameGeek API token (https://boardgamegeek.com/applications), set in the Portainer stack.
      BGG_TOKEN: ${BGG_TOKEN:-}
      # required (default): managing needs a Google sign-in as well as being at home.
      # optional: anyone the gateway lets reach /admin may change things (guests at home too).
      ADMIN_SIGN_IN: ${ADMIN_SIGN_IN:-required}
      # How many daily backups to keep in /data/backups.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    # Data on the host under /opt/boardgame, as for every tool: one folder to copy and back up.
    volumes:
      - /opt/boardgame:/data

networks:
  proxy:
    external: true

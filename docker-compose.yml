# Portainer stack: Repository, compose path docker-compose.yml.
services:
  boardgame-stats:
    build: .
    image: boardgame-stats:latest
    # Rebuild on every deploy, so "Pull and redeploy" picks up changes from GitHub
    pull_policy: build
    container_name: boardgame-stats
    restart: unless-stopped
    # No host port: plain HTTP on port 8080, only on the "proxy" network. Traefik there
    # terminates HTTPS and forwards to http://boardgame-stats:8080 (configured in Traefik).
    # Never publish a port: the app trusts the gateway's X-Auth-Request-Email header.
    expose:
      - "8080"
    networks:
      - proxy
    environment:
      TZ: Europe/Oslo
      # BoardGameGeek API token (https://boardgamegeek.com/applications), set in the Portainer stack.
      BGG_TOKEN: ${BGG_TOKEN:-}
      # Google accounts that may add and change things (comma-separated). Without it, nobody can.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # How many daily backups to keep in /data/backups.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    # Data on the host under /opt/boardgame, as for every tool: one folder to copy and back up.
    volumes:
      - /opt/boardgame:/data

networks:
  proxy:
    external: true
